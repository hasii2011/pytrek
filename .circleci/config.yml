
version: '2.1'

orbs:
  python: circleci/python@4.0.0

workflows:
  main:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/

jobs:
  build:
    docker:
      - image: cimg/python:3.13-browsers
    executor: python/default
    steps:
      - checkout
      - run:
          name: Install library dependencies
          command: |
            pip install --upgrade pip
            python3 --version
            pip install setuptools
            pip install wheel
            pip install buildlackey==2.0.0
            pip install html-testRunner==1.2.1
            pip install codeallybasic==1.30.1
            pip install arcade==3.3.3
            pip install shapely==2.1.3
      - run:
            name: run tests
            command: | 
              unittests
